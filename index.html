<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY AI LAB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #030306;
      --bg-mid: #0a0a12;
      --accent: #22d3ee;
      --accent-soft: rgba(34, 211, 238, 0.35);
      --violet: #a78bfa;
      --text: #e4e4e7;
      --text-muted: #71717a;
      --card-border: rgba(255, 255, 255, 0.08);
      --card-glow: rgba(34, 211, 238, 0.12);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: "Outfit", system-ui, sans-serif;
      background: var(--bg-deep);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #particles {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .ambient {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(34, 211, 238, 0.15), transparent),
        radial-gradient(ellipse 60% 40% at 100% 50%, rgba(167, 139, 250, 0.08), transparent),
        radial-gradient(ellipse 50% 30% at 0% 80%, rgba(34, 211, 238, 0.06), transparent);
    }

    .grid-overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, black 20%, transparent 70%);
    }

    main {
      position: relative;
      z-index: 10;
      width: min(92vw, 520px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(2rem, 5vw, 3rem);
      padding: 2rem 1rem;
    }

    .lab-title {
      font-family: "Syne", sans-serif;
      font-weight: 800;
      font-size: clamp(2.5rem, 8vw, 4rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin: 0;
      text-align: center;
      line-height: 1.05;
      color: #fafafa;
      text-shadow:
        0 0 20px var(--accent-soft),
        0 0 40px rgba(34, 211, 238, 0.25),
        0 0 80px rgba(167, 139, 250, 0.2),
        0 0 120px rgba(34, 211, 238, 0.1);
      animation: titlePulse 4s ease-in-out infinite;
    }

    @keyframes titlePulse {
      0%, 100% {
        filter: brightness(1);
        text-shadow:
          0 0 20px var(--accent-soft),
          0 0 40px rgba(34, 211, 238, 0.25),
          0 0 80px rgba(167, 139, 250, 0.15);
      }
      50% {
        filter: brightness(1.08);
        text-shadow:
          0 0 28px rgba(34, 211, 238, 0.5),
          0 0 56px rgba(34, 211, 238, 0.3),
          0 0 100px rgba(167, 139, 250, 0.25);
      }
    }

    .title-sub {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 0.75rem;
      opacity: 0.9;
    }

    .profile-card {
      width: 100%;
      padding: clamp(1.75rem, 4vw, 2.25rem);
      border-radius: 20px;
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.06) 0%,
        rgba(255, 255, 255, 0.02) 100%
      );
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.04) inset,
        0 24px 48px -12px rgba(0, 0, 0, 0.5),
        0 0 80px -20px var(--card-glow);
      position: relative;
      overflow: hidden;
    }

    .profile-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(34, 211, 238, 0.5),
        rgba(167, 139, 250, 0.4),
        transparent
      );
    }

    .profile-card::after {
      content: "";
      position: absolute;
      width: 200px;
      height: 200px;
      top: -80px;
      right: -80px;
      background: radial-gradient(circle, rgba(34, 211, 238, 0.12), transparent 70%);
      pointer-events: none;
    }

    .card-inner {
      position: relative;
      z-index: 1;
    }

    .name {
      font-family: "Syne", sans-serif;
      font-weight: 700;
      font-size: clamp(1.75rem, 5vw, 2.25rem);
      letter-spacing: -0.02em;
      margin: 0 0 0.5rem;
      background: linear-gradient(135deg, #fafafa 0%, #a1a1aa 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .role {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.25rem;
    }

    .bio {
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.65;
      color: var(--text-muted);
      margin: 0;
    }

    .bio strong {
      color: var(--text);
      font-weight: 500;
    }

    .contact-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      margin-top: 1.25rem;
      padding: 0.9rem 1.25rem;
      border-radius: 12px;
      font-family: "Syne", sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      color: #0a0a12;
      background: linear-gradient(135deg, #22d3ee 0%, #67e8f9 45%, #a5f3fc 100%);
      border: none;
      cursor: pointer;
      box-shadow:
        0 0 24px rgba(34, 211, 238, 0.35),
        0 4px 16px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s ease, box-shadow 0.25s ease, filter 0.2s ease;
    }

    .contact-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
      box-shadow:
        0 0 36px rgba(34, 211, 238, 0.5),
        0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .contact-btn:active {
      transform: translateY(0);
    }

    .contact-btn svg {
      width: 1rem;
      height: 1rem;
      opacity: 0.85;
    }

    .card-footer {
      margin-top: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.06em;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
  </style>
</head>
<body>
  <canvas id="particles" aria-hidden="true"></canvas>
  <div class="ambient" aria-hidden="true"></div>
  <div class="grid-overlay" aria-hidden="true"></div>

  <main>
    <header>
      <h1 class="lab-title">MY AI LAB</h1>
      <p class="title-sub">Research · Build · Iterate</p>
    </header>

    <article class="profile-card">
      <div class="card-inner">
        <h2 class="name">[seoyoongchi]</h2>
        <p class="role">Creative technologist</p>
        <p class="bio">
          I started from curiosity and keep leveling up—turning concepts into hands-on builds as I learn how AI actually thinks, fails, and improves.
        </p>
        <div class="card-footer">
          <span class="status-dot" aria-hidden="true"></span>
          <span>Systems online</span>
        </div>
        <a class="contact-btn" href="mailto:you@example.com" aria-label="Contact me by email">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          Contact Me
        </a>
      </div>
    </article>
  </main>

  <script>
    (function () {
      const canvas = document.getElementById("particles");
      const ctx = canvas.getContext("2d");
      let particles = [];
      let w = 0;
      let h = 0;
      let raf = 0;

      function resize() {
        w = canvas.width = Math.floor(window.innerWidth * window.devicePixelRatio);
        h = canvas.height = Math.floor(window.innerHeight * window.devicePixelRatio);
        canvas.style.width = window.innerWidth + "px";
        canvas.style.height = window.innerHeight + "px";
        initParticles();
      }

      function initParticles() {
        const area = (w * h) / (window.devicePixelRatio ** 2);
        const count = Math.min(140, Math.max(50, Math.floor(area / 12000)));
        particles = [];
        for (let i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * w,
            y: Math.random() * h,
            z: Math.random(),
            vx: (Math.random() - 0.5) * 0.35,
            vy: (Math.random() - 0.5) * 0.35,
            r: 0.6 + Math.random() * 1.8,
          });
        }
      }

      function step() {
        ctx.clearRect(0, 0, w, h);
        const t = performance.now() * 0.00015;

        for (const p of particles) {
          p.x += p.vx + Math.sin(t + p.z * 10) * 0.08;
          p.y += p.vy + Math.cos(t * 0.8 + p.z * 8) * 0.08;

          if (p.x < -20) p.x = w + 20;
          if (p.x > w + 20) p.x = -20;
          if (p.y < -20) p.y = h + 20;
          if (p.y > h + 20) p.y = -20;

          const alpha = 0.15 + p.z * 0.55;
          const glow = p.z > 0.65;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r * window.devicePixelRatio, 0, Math.PI * 2);
          if (glow) {
            ctx.shadowBlur = 12 * window.devicePixelRatio;
            ctx.shadowColor = "rgba(34, 211, 238, 0.6)";
          } else {
            ctx.shadowBlur = 0;
          }
          ctx.fillStyle = glow
            ? `rgba(167, 220, 255, ${alpha})`
            : `rgba(180, 190, 210, ${alpha * 0.7})`;
          ctx.fill();
          ctx.shadowBlur = 0;
        }

        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const a = particles[i];
            const b = particles[j];
            const dx = a.x - b.x;
            const dy = a.y - b.y;
            const dist = Math.hypot(dx, dy);
            const maxDist = 100 * window.devicePixelRatio;
            if (dist < maxDist) {
              const lineAlpha = (1 - dist / maxDist) * 0.08 * (a.z + b.z) * 0.5;
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
              ctx.strokeStyle = `rgba(34, 211, 238, ${lineAlpha})`;
              ctx.lineWidth = 0.5 * window.devicePixelRatio;
              ctx.stroke();
            }
          }
        }

        raf = requestAnimationFrame(step);
      }

      window.addEventListener("resize", resize);
      resize();
      step();

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
          cancelAnimationFrame(raf);
        } else {
          step();
        }
      });
    })();
  </script>
</body>
</html>
